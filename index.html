<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ALEXSCPS</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1><span>DILFY</span>SCPS</h1>
  <nav>
    <a href="#">HOME</a>
    <a href="#">PACKS</a>
    <a href="#">SOCIALS</a>
  </nav>
</header>

<section class="hero">
  <h2>DILFY<span>SCPS</span></h2>
  <p>High-quality scenepacks, clean browsing, and fast downloads</p>
  <button>Browse Packs</button>
</section>

<section class="packs">
  <h2>Featured Packs</h2>

  <div class="grid">

    <div class="card" onclick="openModal('img1.jpg','LUUKE V3')">
      <img src="images/img1.jpg">
      <div class="overlay">LUUKE V3</div>
    </div>

    <div class="card" onclick="openModal('img2.jpg','SIMPLE NOLAN')">
      <img src="images/img2.jpg">
      <div class="overlay">SIMPLE NOLAN</div>
    </div>

  </div>
</section>

<!-- Modal -->
<div id="modal">
  <div class="modal-box">
    <img id="modal-img">
    <h3 id="modal-title"></h3>

    <div class="buttons">
      <button class="download" onclick="download()">Download</button>
      <button onclick="closeModal()">Close</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
